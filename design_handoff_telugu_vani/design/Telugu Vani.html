<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Telugu Vani</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,500;1,600;1,700;1,800&family=Mulish:wght@400;500;600;700;800&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Serif+Telugu:wght@400;500;600;700&family=Ramaraja&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #FBF4E4; min-height: 100vh; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  ::selection { background: rgba(240,86,14,0.18); }
  button:focus-visible { outline: 2px solid #F0560E; outline-offset: 2px; }

  @keyframes tvPageIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes tvRise   { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  @keyframes tvGlow   { 0%,100% { opacity: .6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
  @keyframes tvPop    { from { opacity: 0; transform: scale(.85) translateY(-6px); } to { opacity: 1; transform: none; } }

  /* card hover arrow nudge */
  .tv-cards > div:hover .tv-arrow { transform: translateX(4px); }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .tv-hero { grid-template-columns: 1fr !important; gap: 30px !important; }
    .tv-hero > div:last-child { order: -1; }
    .tv-cards { grid-template-columns: 1fr !important; }
    .tv-trace-grid { grid-template-columns: 1fr !important; }
    .tv-shloka-grid { grid-template-columns: 1fr !important; }
    .tv-stats { grid-template-columns: repeat(2,1fr) !important; }
    .tv-stats3 { grid-template-columns: 1fr !important; }
    .tv-navlinks { display: none !important; }
    .tv-learner { grid-template-columns: 1fr 1fr !important; row-gap: 6px !important; }
  }
  @media (max-width: 540px) {
    .tv-stats { grid-template-columns: 1fr !important; }
    .tv-learner { grid-template-columns: 1fr !important; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="image-slot.js"></script>
<script src="data.js"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="screen-home.jsx"></script>
<script type="text/babel" src="screen-tracing.jsx"></script>
<script type="text/babel" src="screen-shlokas.jsx"></script>
<script type="text/babel" src="screen-progress.jsx"></script>
<script type="text/babel" src="screen-admin.jsx"></script>

<script type="text/babel">
  const { useState, useEffect } = React;
  const { TopNav, Footer, DotField, Page } = window;

  const SCREENS = {
    home: window.Home, tracing: window.Tracing, shlokas: window.Shlokas,
    progress: window.Progress, admin: window.Admin,
  };

  function App() {
    const [route, setRoute] = useState(() => (location.hash || '#home').slice(1));
    function go(r) { setRoute(r); location.hash = r; window.scrollTo({ top: 0, behavior: 'smooth' }); }
    useEffect(() => {
      const h = () => setRoute((location.hash || '#home').slice(1));
      window.addEventListener('hashchange', h); return () => window.removeEventListener('hashchange', h);
    }, []);
    const Screen = SCREENS[route] || window.Home;
    return (
      <div style={{ position: 'relative', minHeight: '100vh' }}>
        <DotField />
        <TopNav route={route} go={go} />
        <Page k={route}><Screen go={go} /></Page>
        <Footer />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
